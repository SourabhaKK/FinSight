[project]
name = "finsight"
version = "0.1.0"
description = "Financial News Risk Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "google-generativeai>=0.8",
    "groq>=0.9",
    "openai>=1.0",
    "httpx>=0.27",
    "transformers>=4.40",
    "torch>=2.2",
    "datasets>=2.19",
    "scikit-learn>=1.9",
    "joblib>=1.4",
    "scipy>=1.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "codecarbon>=2.3",
    "pyarrow>=21.0.0",
    "mlflow>=2.13.0",
    "sentence-transformers>=5.6.0",
    "qdrant-client>=1.18.0",
    "ragas==0.1.21",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx2>=2.0",
    "langchain-groq==0.1.10",          # exact-pin: requires langchain-core<0.3
    "langchain-core==0.2.43",          # exact-pin: pydantic_v1 removed in 0.3+, needed by ragas 0.1.21 + langchain-groq 0.1.10
    "langchain-openai>=0.1.0",         # RAGAS judge LLM (gpt-4o-mini) + embeddings (text-embedding-3-small)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "benchmark: marks tests as latency benchmarks",
    "integration: marks tests requiring a live external service (e.g. Qdrant)",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["."]
typeCheckingMode = "basic"
