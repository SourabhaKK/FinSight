name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync --dev
      - run: uv run mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ollama
      GEMINI_API_KEY: dummy
      GEMINI_MODEL: gemini-2.0-flash
      GROQ_API_KEY: dummy
      GROQ_MODEL: llama-3.3-70b-versatile
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.2:3b
      DISTILBERT_MODEL_PATH: artefacts/distilbert_finsight.pt
      BASELINE_MODEL_PATH: artefacts/baseline_pipeline.joblib
      URGENCY_MODEL_PATH: artefacts/urgency_pipeline.joblib
      LOG_LEVEL: INFO
      MAX_TEXT_LENGTH: "10000"
      MIN_TEXT_LENGTH: "10"
      QDRANT_URL: http://localhost:6333
      RAG_COLLECTION_NAME: finsight_corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync --dev
      - run: >
          uv run pytest tests/ -v
          -m "not slow and not benchmark and not integration"
          --tb=short -x

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t finsight .
