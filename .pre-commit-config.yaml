repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # Same command as the `lint` job in .github/workflows/ci.yml
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check src/ tests/
        language: system
        pass_filenames: false
        types: [python]
